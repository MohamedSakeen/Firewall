services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: netguard-backend:local
    environment:
      FIREWALL_HOST: 0.0.0.0
      FIREWALL_PORT: 5000
      FIREWALL_DB_PATH: /app/data/firewall.db
      FIREWALL_ROLE: ${FIREWALL_ROLE:-api}
      FIREWALL_ENABLE_SNIFFER: ${FIREWALL_ENABLE_SNIFFER:-0}
      FIREWALL_ALLOWED_ORIGINS: "${FIREWALL_ALLOWED_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}"
      FIREWALL_SECRET_KEY: ${FIREWALL_SECRET_KEY:-}
      FIREWALL_COOKIE_SECURE: ${FIREWALL_COOKIE_SECURE:-false}
      FIREWALL_EVENT_RETENTION_DAYS: ${FIREWALL_EVENT_RETENTION_DAYS:-30}
      FIREWALL_RESPONSE_MODE: ${FIREWALL_RESPONSE_MODE:-shadow}
      FIREWALL_AUTONOMY_LEVEL: ${FIREWALL_AUTONOMY_LEVEL:-LEVEL_1_RECOMMEND}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5000}:5000"
    volumes:
      - data:/app/data
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://127.0.0.1:5000/api}"
        VITE_SOCKET_URL: "${VITE_SOCKET_URL:-http://127.0.0.1:5000}"
    image: netguard-frontend:local
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    depends_on:
      - backend
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  data:
